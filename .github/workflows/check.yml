name: check
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: sync
        run: uv sync --extra dev --locked
      - name: lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: test
        run: uv run pytest -q
      - name: manifests validate
        run: uv run python scripts/validate_experiment.py
      - name: experiment log is current
        run: uv run python scripts/experiment_log.py --check
      - name: reports validate
        run: uv run python scripts/report_check.py
